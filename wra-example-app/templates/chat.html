{% extends "base.html" %}

{% block header %}Chat{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5><i class="fas fa-comments"></i> Funny chat</h5>
                <span class="badge bg-primary">Online</span>
            </div>
            <div class="card-body p-0">
                <div id="chat-container" class="border" style="height: 400px; overflow-y: auto; padding: 15px;">
                    <!-- Messages will appear here -->
                    <div id="messages">
                        {% for message in messages %}
                            <div class="message mb-2">
                                <div class="d-flex {% if message.sender_username == current_user.username %}justify-content-end{% else %}justify-content-start{% endif %}">
                                    <div class="card {% if message.sender_username == current_user.username %}bg-primary text-white{% else %}bg-light{% endif %}"
                                         style="max-width: 70%;">
                                        <div class="card-body p-2">
                                            <div class="d-flex justify-content-between">
                                                <small><strong>{{ message.sender_username }}</strong></small>
                                                <small>{{ message.timestamp.strftime('%H:%M') }}</small>
                                            </div>
                                            <p class="mb-0">{{ message.content|safe  }}</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="card-footer">
                    <div class="input-group">
                        <input type="text" class="form-control" id="message-input" placeholder="Type your message...">
                        <button class="btn btn-primary" id="send-btn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Global variables
    let lastMessageId = 0;
    let pollingInterval;

    // Send message when button is clicked
    document.getElementById('send-btn').addEventListener('click', function() {
        sendMessage();
    });

    // Send message when Enter is pressed
    document.getElementById('message-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // Function to send a message via HTTP POST
    async function sendMessage() {
        var messageInput = document.getElementById('message-input');
        var message = messageInput.value.trim();

        if (message !== '') {
            try {
                const response = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        "X-Wra-Fp": JSON.stringify(exampleFingerPrint)
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (data.success) {
                    messageInput.value = '';
                    // Add the message to the chat immediately
                    addMessageToChat(data.message);
                } else {
                    alert('Error sending message: ' + data.error);
                }
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Error sending message');
            }
        }
    }

    // Function to add a message to the chat UI
    function addMessageToChat(message) {
        var messagesContainer = document.getElementById('messages');

        var messageDiv = document.createElement('div');
        messageDiv.className = 'message mb-2';

        var alignment = message.sender_username === '{{ current_user.username }}' ? 'justify-content-end' : 'justify-content-start';
        var bgColor = message.sender_username === '{{ current_user.username }}' ? 'bg-primary text-white' : 'bg-light';

        messageDiv.innerHTML = `
            <div class="d-flex ${alignment}">
                <div class="card ${bgColor}" style="max-width: 70%;">
                    <div class="card-body p-2">
                        <div class="d-flex justify-content-between">
                            <small><strong>${message.sender_username}</strong></small>
                            <small>${message.timestamp}</small>
                        </div>
                        <p class="mb-0">${message.content}</p>
                    </div>
                </div>
            </div>
        `;

        messagesContainer.appendChild(messageDiv);

        // Scroll to bottom
        var chatContainer = document.getElementById('chat-container');
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // Update the last message ID
        if (message.id > lastMessageId) {
            lastMessageId = message.id;
        }
    }

    // Function to load messages via HTTP GET
    async function loadMessages() {
        try {
            const response = await fetch('/api/chat/messages');
            const messages = await response.json();

            // Find the last message ID to avoid duplicates
            if (messages.length > 0) {
                var lastExistingMessageId = lastMessageId;
                var messagesContainer = document.getElementById('messages');

                // Add any new messages that aren't already displayed
                messages.forEach(function(msg) {
                    if (msg.id > lastExistingMessageId) {
                        addMessageToChat(msg);
                    }
                });

                // Update the last message ID if needed
                if (messages.length > 0) {
                    const latestId = Math.max(...messages.map(m => m.id));
                    if (latestId > lastMessageId) {
                        lastMessageId = latestId;
                    }
                }
            }
        } catch (error) {
            console.error('Error loading messages:', error);
        }
    }

    // Initialize the chat
    window.onload = function() {
        // Scroll to bottom on page load
        var chatContainer = document.getElementById('chat-container');
        chatContainer.scrollTop = chatContainer.scrollHeight;

        // Start polling for new messages every second
        pollingInterval = setInterval(loadMessages, 1000);
    };

    // Clean up interval when page is unloaded
    window.addEventListener('beforeunload', function() {
        if (pollingInterval) {
            clearInterval(pollingInterval);
        }
    });
</script>
{% endblock %}
