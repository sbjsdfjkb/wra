{% macro input_field(name, label, type="text", placeholder="", required=false) %}
<div class="mb-3">
    <label for="{{ name }}" class="form-label">{{ label }}</label>
    <input 
        type="{{ type }}" 
        class="form-control" 
        id="{{ name }}" 
        name="{{ name }}" 
        {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
        {% if required %}required{% endif %}>
</div>
{% endmacro %}

{% macro textarea_field(name, label, placeholder="", required=false, rows=3) %}
<div class="mb-3">
    <label for="{{ name }}" class="form-label">{{ label }}</label>
    <textarea 
        class="form-control" 
        id="{{ name }}" 
        name="{{ name }}" 
        rows="{{ rows }}"
        {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
        {% if required %}required{% endif %}></textarea>
</div>
{% endmacro %}

{% macro select_field(name, label, options=[], selected="") %}
<div class="mb-3">
    <label for="{{ name }}" class="form-label">{{ label }}</label>
    <select class="form-select" id="{{ name }}" name="{{ name }}">
        {% for option in options %}
        <option value="{{ option.value }}" {% if option.value == selected %}selected{% endif %}>{{ option.text }}</option>
        {% endfor %}
    </select>
</div>
{% endmacro %}
