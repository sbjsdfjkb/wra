{% macro bank_header(title="ЫБанк", show_user_info=true) %}
<div class="header d-flex justify-content-between align-items-center">
    <h2><i class="fas fa-university"></i> {{ title }}</h2>
    {% if show_user_info and current_user.is_authenticated %}
        <div class="user-info text-end">
            <small>Welcome, {{ current_user.username }}!</small>
        </div>
    {% endif %}
</div>
{% endmacro %}

{% macro sidebar_nav(current_endpoint) %}
<nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
    <div class="position-sticky pt-3">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link text-white {% if current_endpoint == 'dashboard' %}active{% endif %}"
                   href="{{ url_for('dashboard') }}">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white {% if current_endpoint == 'operations' %}active{% endif %}"
                   href="{{ url_for('operations') }}">
                    <i class="fas fa-exchange-alt"></i> Operations
                </a>
            </li>
            <li class="nav-item mt-3">
                <a class="nav-link text-white" href="{{ url_for('logout') }}">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </li>
        </ul>
    </div>
</nav>
{% endmacro %}
