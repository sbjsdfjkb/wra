<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ЫБанк</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card mt-5">
                    <div class="card-header d-flex align-items-center">
                        <i class="fas fa-university fa-2x me-3 text-primary"></i>
                        <div>
                            <h3 class="text-center mb-0">ЫБанк</h3>
                            <p class="text-center text-muted small mb-0">Sign in to your account</p>
                        </div>
                    </div>
                    <div class="card-body">
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-danger">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>

                        <div id="login-error" class="alert alert-danger mt-3" style="display: none;"></div>

                        <script>
                                document.getElementById('loginForm').addEventListener('submit', async function(e) {
                                e.preventDefault();

                                const formData = {
                                    username: document.getElementById('username').value,
                                    password: document.getElementById('password').value
                                };

                                    const exampleFingerPrint = {
                                    "gpu": "arduino",
                                    "fonts": 19,
                                    "x_hash": "0ab8f763fb"
                                }

                                try {
                                    const response = await fetch('/login', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            "X-Wra-Fp": JSON.stringify(exampleFingerPrint)
                                        },
                                        body: JSON.stringify(formData)
                                    });

                                    const data = await response.json();

                                    if (data.success) {
                                        window.location.href = data.redirect;
                                        localStorage.setItem("wra-attest", response.headers.get('X-Wra-Private'))
                                        localStorage.setItem("wra-public", response.headers.get('X-Wra-Public'))
                                    } else {
                                        document.getElementById('login-error').textContent = data.error;
                                        document.getElementById('login-error').style.display = 'block';
                                    }
                                } catch (error) {
                                    document.getElementById('login-error').textContent = 'An error occurred during login';
                                    document.getElementById('login-error').style.display = 'block';
                                }
                            });
                        </script>

                        <div class="mt-3 text-center">
                            <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
