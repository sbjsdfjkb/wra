<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SecureBank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card mt-5">
                    <div class="card-header d-flex align-items-center">
                        <i class="fas fa-university fa-2x me-3 text-primary"></i>
                        <div>
                            <h3 class="text-center mb-0">SecureBank</h3>
                            <p class="text-center text-muted small mb-0">Create your account</p>
                        </div>
                    </div>
                    <div class="card-body">
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert alert-danger">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>

                        <div id="register-error" class="alert alert-danger mt-3" style="display: none;"></div>
                        <div id="register-success" class="alert alert-success mt-3" style="display: none;"></div>

                        <script>
                            document.getElementById('registerForm').addEventListener('submit', async function(e) {
                                e.preventDefault();

                                const formData = {
                                    username: document.getElementById('username').value,
                                    email: document.getElementById('email').value,
                                    password: document.getElementById('password').value
                                };

                                try {
                                    const response = await fetch('/register', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                        },
                                        body: JSON.stringify(formData)
                                    });

                                    const data = await response.json();

                                    if (data.success) {
                                        document.getElementById('register-success').textContent = 'Registration successful! Redirecting to login...';
                                        document.getElementById('register-success').style.display = 'block';
                                        setTimeout(() => {
                                            window.location.href = data.redirect;
                                        }, 2000);
                                    } else {
                                        document.getElementById('register-error').textContent = data.error;
                                        document.getElementById('register-error').style.display = 'block';
                                    }
                                } catch (error) {
                                    document.getElementById('register-error').textContent = 'An error occurred during registration';
                                    document.getElementById('register-error').style.display = 'block';
                                }
                            });
                        </script>
                        
                        <div class="mt-3 text-center">
                            <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
